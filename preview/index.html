function updateWatch(){[...watchGrid.children].forEach(card=>card.classList.toggle('watch-selected',Number(card.dataset.index)===watchIndex&&activeRow==='watch'))}
function renderWatch(focus=false){watchGrid.replaceChildren();for(let i=watchStart;i<Math.min(watchStart+4,watchSnapshot.length);i++){const item=watchSnapshot[i],card=document.createElement('button');card.className='watch-card';card.style.background='linear-gradient(145deg,'+tone(item.pkg)+',#111720)';card.dataset.index=i;card.setAttribute('aria-label','Continuar '+item.title+' no '+item.app);const shade=document.createElement('span');shade.className='watch-shade';card.append(shade);const provider=document.createElement('img');provider.className='watch-provider';provider.src=demoImage(item.app,tone(item.pkg),true);provider.alt=item.app;card.append(provider);if(item.kind===1){const next=document.createElement('span');next.className='watch-kind';next.textContent='Próximo episódio';card.append(next)}const play=document.createElement('span');play.className='watch-play';play.setAttribute('aria-hidden','true');play.textContent='▶';card.append(play);const info=document.createElement('span');info.className='watch-info';const title=document.createElement('span');title.className='watch-title';title.textContent=item.title;info.append(title);card.append(info);if(item.duration>0&&item.position>0){const bar=document.createElement('span');bar.className='watch-progress';const fill=document.createElement('i');fill.style.width=Math.min(100,100*item.position/item.duration)+'%';bar.append(fill);card.append(bar)}card.onfocus=card.onmouseenter=()=>{activeRow='watch';watchIndex=i;update();updateWatch()};card.onclick=()=>toast('Conteúdo fictício usado apenas na demonstração.');watchGrid.append(card)}updateWatch();if(focus)[...watchGrid.children].find(b=>Number(b.dataset.index)===watchIndex)?.focus({preventScroll:true})}
function moveWatch(delta){const n=watchSnapshot.length,next=Math.max(0,Math.min(watchIndex+delta,n-1));if(next===watchIndex)return;watchIndex=next;const cap=visibleSlots(watchGrid.parentElement,watchGrid.children[0],parseFloat(getComputedStyle(watchGrid).gap)||18,n);watchStart=windowStartFor(watchIndex,watchStart,n,cap);renderWatch(true)}
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(e.key==='ArrowDown'&&activeRow==='apps'){e.preventDefault();activeRow='watch';renderWatch(true);update()}if(e.key==='ArrowUp'&&activeRow==='watch'){e.preventDefault();activeRow='apps';render(true);updateWatch()}});renderWatch();
</script></html>
